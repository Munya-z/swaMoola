[package]
name = "swa_moola_frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = { version = "0.8.13"}
leptos-use = { version = "0.18.3", features = ["storage"] }
serde = { version = "1", features = ["derive"]}
uuid =  { version = "1.23.0", features = ["v4", "serde", "js"] }
reqwest =  { version = "0.13.4", features = ["json", "multipart"] }
log = "0.4.32"
wasm-logger = "0.2.0" 
once_cell = "1.21.4"
chrono = { version ="0.4.44", features = ["serde"]}
console_error_panic_hook = "0.1.7"
ws_stream_wasm = "0.7.5"
futures-util = "0.3" 
js-sys = "0.3.99"
wasm-bindgen-futures = "0.4.72"
wasm-bindgen = "0.2"
base64 = "0.22"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ml-kem = "0.3.2"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = { version = "0.8.5", features = ["std", "getrandom"] }
rand_core = { version = "0.10.0" }
getrandom = { version = "0.2.15", features = ["js"] }
chacha20poly1305 = { version = "0.10", features = ["alloc", "stream"] }
rand_chacha_v3 = { package = "rand_chacha", version = "0.3.1" }
rand_chacha = "0.10.0"
hybrid-array = "0.4.12"

[dependencies.web-sys]
version = "0.3"
features = ["Window",  "Performance", "Response", "Blob","BlobPropertyBag", "Url"]

[package.metadata.leptos]
assets-dir = "public"
site-root = "target/site"

